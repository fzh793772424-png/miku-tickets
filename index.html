<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Mirai 票务图形看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --miku: #39C5BB; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { background: var(--miku); color: white; padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .legend { display: flex; gap: 15px; justify-content: center; margin: 15px 0; font-size: 0.85rem; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        
        .stage-map-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .map-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stage { background: #333; color: white; text-align: center; padding: 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-bottom: 12px; }
        
        .seat-section { margin-top: 10px; }
        .section-title { font-size: 0.75rem; color: #666; margin-bottom: 5px; text-align: center; }
        .seat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        
        .seat-node { border-radius: 5px; padding: 8px 4px; text-align: center; font-size: 0.75rem; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .seat-node:active { transform: scale(0.95); }
        .status-在手 { background-color: #2ec4b6; }
        .status-预定 { background-color: #ff9f1c; }
        .status-已出 { background-color: #e71d36; }
        
        .form-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        input, select, button { padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.9rem; }
        button { background: var(--miku); color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>⚡ Ticket Map 座位图形看板</h2>
        <span id="sync-status" style="font-size: 0.8rem;">🔄 连接中...</span>
    </header>

    <!-- 图例 -->
    <div class="legend">
        <div class="legend-item"><span class="dot status-在手"></span> 在手</div>
        <div class="legend-item"><span class="dot status-预定"></span> 预定</div>
        <div class="legend-item"><span class="dot status-已出"></span> 已出</div>
    </div>

    <!-- 图形化座位展示区 -->
    <div class="stage-map-container">
        <!-- 大阪场 -->
        <div class="map-card">
            <h3 style="text-align: center; margin-top:0;">大阪场</h3>
            <div class="stage">STAGE 舞台 FRONT</div>
            <div class="seat-section">
                <div class="section-title">--- SS 区 ---</div>
                <div id="grid-大阪场-SS" class="seat-grid"></div>
            </div>
            <div class="seat-section">
                <div class="section-title">--- S / A 区 ---</div>
                <div id="grid-大阪场-其他" class="seat-grid"></div>
            </div>
        </div>

        <!-- 东京 Day1 -->
        <div class="map-card">
            <h3 style="text-align: center; margin-top:0;">东京 Day1</h3>
            <div class="stage">STAGE 舞台 FRONT</div>
            <div class="seat-section">
                <div class="section-title">--- SS 区 ---</div>
                <div id="grid-东京 Day1-SS" class="seat-grid"></div>
            </div>
            <div class="seat-section">
                <div class="section-title">--- S / A 区 ---</div>
                <div id="grid-东京 Day1-其他" class="seat-grid"></div>
            </div>
        </div>

        <!-- 东京 Day2 -->
        <div class="map-card">
            <h3 style="text-align: center; margin-top:0;">东京 Day2</h3>
            <div class="stage">STAGE 舞台 FRONT</div>
            <div class="seat-section">
                <div class="section-title">--- SS 区 ---</div>
                <div id="grid-东京 Day2-SS" class="seat-grid"></div>
            </div>
            <div class="seat-section">
                <div class="section-title">--- S / A 区 ---</div>
                <div id="grid-东京 Day2-其他" class="seat-grid"></div>
            </div>
        </div>
    </div>

    <!-- 快速录入/改票 -->
    <div class="form-box">
        <h3>➕ 录入/更新票务</h3>
        <div class="form-grid">
            <select id="in-show">
                <option value="大阪场">大阪场</option>
                <option value="东京 Day1">东京 Day1</option>
                <option value="东京 Day2">东京 Day2</option>
            </select>
            <input type="text" id="in-seat" placeholder="位置 (例: SS 5排12)">
            <select id="in-status">
                <option value="在手">在手</option>
                <option value="预定">预定</option>
                <option value="已出">已出</option>
            </select>
            <input type="text" id="in-price" placeholder="价格">
            <input type="text" id="in-buyer" placeholder="买家/对接人">
            <input type="text" id="in-note" placeholder="备注">
            <button onclick="addTicket()">保存票据</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://matckyhwzjwmdazpqzgx.supabase.co';
    const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hdGNreWh3emp3bWRhenBxemd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjE5MjgsImV4cCI6MjEwMzgzNzkyOH0.cYWrlh_SwCkFXIJZt67xtK2HMotsqzhQzzQLAYYEg3g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allTickets = [];

    async function init() {
        fetchTickets();
        _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => fetchTickets())
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') document.getElementById('sync-status').innerText = '🟢 实时同步中';
            });
    }

    async function fetchTickets() {
        const { data } = await _supabase.from('tickets').select('*');
        if (data) {
            allTickets = data;
            renderMap();
        }
    }

    function renderMap() {
        const containers = ['大阪场-SS', '大阪场-其他', '东京 Day1-SS', '东京 Day1-其他', '东京 Day2-SS', '东京 Day2-其他'];
        containers.forEach(id => {
            const el = document.getElementById(`grid-${id}`);
            if(el) el.innerHTML = '';
        });

        allTickets.forEach(t => {
            const isSS = t.seat && t.seat.toUpperCase().includes('SS');
            const targetGridId = `grid-${t.show}-${isSS ? 'SS' : '其他'}`;
            const gridEl = document.getElementById(targetGridId);

            if (gridEl) {
                const node = document.createElement('div');
                node.className = `seat-node status-${t.status}`;
                node.innerText = t.seat || '未命名';
                node.title = `买家: ${t.buyer||'无'}\n价格: ${t.price||'无'}\n备注: ${t.note||'无'}`;
                node.onclick = () => handleSeatClick(t);
                gridEl.appendChild(node);
            }
        });
    }

    async function handleSeatClick(ticket) {
        const action = confirm(`【${ticket.show} - ${ticket.seat}】\n状态: ${ticket.status}\n买家: ${ticket.buyer||'无'}\n价格: ${ticket.price||'无'}\n备注: ${ticket.note||'无'}\n\n按“确定”切换状态（在手->预定->已出），按“取消”不做更改。`);
        if (action) {
            const nextStatus = ticket.status === '在手' ? '预定' : (ticket.status === '预定' ? '已出' : '在手');
            await _supabase.from('tickets').update({ status: nextStatus }).eq('id', ticket.id);
        }
    }

    async function addTicket() {
        const show = document.getElementById('in-show').value;
        const seat = document.getElementById('in-seat').value;
        const status = document.getElementById('in-status').value;
        const price = document.getElementById('in-price').value;
        const buyer = document.getElementById('in-buyer').value;
        const note = document.getElementById('in-note').value;

        if(!seat) { alert('请填写座位位置！'); return; }

        await _supabase.from('tickets').insert([{ show, seat, status, price, buyer, note }]);
        document.getElementById('in-seat').value = '';
        document.getElementById('in-note').value = '';
    }

    init();
</script>
</body>
</html>
