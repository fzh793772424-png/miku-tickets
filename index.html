<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Mirai 票务分类看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --miku: #39C5BB; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: var(--miku); color: white; padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .legend { display: flex; gap: 15px; justify-content: center; margin: 15px 0; font-size: 0.85rem; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        
        .stage-map-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .map-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stage { background: #333; color: white; text-align: center; padding: 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-bottom: 12px; }
        
        .type-section { margin-top: 10px; border-top: 1px dashed #eee; padding-top: 6px; }
        .type-title { font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; min-height: 35px; }
        
        .seat-node { border-radius: 6px; padding: 8px; text-align: left; font-size: 0.75rem; color: white; cursor: pointer; transition: transform 0.1s; }
        .seat-node:active { transform: scale(0.96); }
        .seat-node .seat-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; }
        .seat-node .seat-sub { font-size: 0.7rem; opacity: 0.9; }
        
        .status-在手 { background-color: #2ec4b6; }
        .status-预定 { background-color: #ff9f1c; }
        .status-已出 { background-color: #e71d36; }
        
        .form-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
        input, select, button { padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 0.85rem; }
        button { background: var(--miku); color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>⚡ Magical Mirai 票务看板</h2>
        <span id="sync-status" style="font-size: 0.8rem;">🔄 连接中...</span>
    </header>

    <div class="legend">
        <div class="legend-item"><span class="dot status-在手"></span> 在手</div>
        <div class="legend-item"><span class="dot status-预定"></span> 预定</div>
        <div class="legend-item"><span class="dot status-已出"></span> 已出</div>
    </div>

    <div class="stage-map-container">
        <div class="map-card">
            <h3 style="text-align: center; margin-top:0; color:#333;">广岛场</h3>
            <div class="stage">STAGE 舞台</div>
            <div class="type-section">
                <div class="type-title">🌐 海外票</div>
                <div id="grid-广岛场-海外票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">👥 本土二连</div>
                <div id="grid-广岛场-本土二连" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🇯🇵 本土母票</div>
                <div id="grid-广岛场-本土母票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🎫 本土子票</div>
                <div id="grid-广岛场-本土子票" class="seat-grid"></div>
            </div>
        </div>

        <div class="map-card">
            <h3 style="text-align: center; margin-top:0; color:#333;">大阪场</h3>
            <div class="stage">STAGE 舞台</div>
            <div class="type-section">
                <div class="type-title">🌐 海外票</div>
                <div id="grid-大阪场-海外票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">👥 本土二连</div>
                <div id="grid-大阪场-本土二连" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🇯🇵 本土母票</div>
                <div id="grid-大阪场-本土母票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🎫 本土子票</div>
                <div id="grid-大阪场-本土子票" class="seat-grid"></div>
            </div>
        </div>

        <div class="map-card">
            <h3 style="text-align: center; margin-top:0; color:#333;">东京场</h3>
            <div class="stage">STAGE 舞台</div>
            <div class="type-section">
                <div class="type-title">🌐 海外票</div>
                <div id="grid-东京场-海外票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">👥 本土二连</div>
                <div id="grid-东京场-本土二连" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🇯🇵 本土母票</div>
                <div id="grid-东京场-本土母票" class="seat-grid"></div>
            </div>
            <div class="type-section">
                <div class="type-title">🎫 本土子票</div>
                <div id="grid-东京场-本土子票" class="seat-grid"></div>
            </div>
        </div>
    </div>

    <div class="form-box">
        <h3>➕ 录入票据</h3>
        <div class="form-grid">
            <select id="in-show">
                <option value="广岛场">广岛场</option>
                <option value="大阪场">大阪场</option>
                <option value="东京场">东京场</option>
            </select>
            <select id="in-type">
                <option value="海外票">海外票</option>
                <option value="本土二连">本土二连</option>
                <option value="本土母票">本土母票</option>
                <option value="本土子票">本土子票</option>
            </select>
            <input type="text" id="in-seat" placeholder="编号/位置 (例: 01号)">
            <select id="in-status">
                <option value="在手">在手</option>
                <option value="预定">预定</option>
                <option value="已出">已出</option>
            </select>
            <input type="text" id="in-price" placeholder="价格">
            <input type="text" id="in-buyer" placeholder="买家/联系人">
            <input type="text" id="in-note" placeholder="备注">
            <button onclick="addTicket()">保存票据</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://matckyhwzjwmdazpqzgx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hdGNreWh3emp3bWRhenBxemd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjE5MjgsImV4cCI6MjEwMzgzNzkyOH0.cYWrlh_SwCkFXIJZt67xtK2HMotsqzhQzzQLAYYEg3g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allTickets = [];

    async function init() {
        fetchTickets();
        _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => fetchTickets())
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    document.getElementById('sync-status').innerText = '🟢 实时同步中';
                }
            });
    }

    async function fetchTickets() {
        const { data } = await _supabase.from('tickets').select('*');
        if (data) {
            allTickets = data;
            renderMap();
            document.getElementById('sync-status').innerText = '🟢 实时同步中';
        }
    }

    function renderMap() {
        const shows = ['广岛场', '大阪场', '东京场'];
        const types = ['海外票', '本土二连', '本土母票', '本土子票'];
        
        shows.forEach(s => {
            types.forEach(t => {
                const el = document.getElementById(`grid-${s}-${t}`);
                if (el) el.innerHTML = '';
            });
        });

        allTickets.forEach(t => {
            let ticketType = '海外票';
            if (t.note) {
                if (t.note.includes('本土二连')) ticketType = '本土二连';
                else if (t.note.includes('本土母票')) ticketType = '本土母票';
                else if (t.note.includes('本土子票')) ticketType = '本土子票';
                else if (t.note.includes('海外票')) ticketType = '海外票';
            }

            const targetGridId = `grid-${t.show}-${ticketType}`;
            const gridEl = document.getElementById(targetGridId);

            if (gridEl) {
                const node = document.createElement('div');
                node.className = `seat-node status-${t.status}`;
                node.innerHTML = `
                    <div class="seat-title">${t.seat || '未命名'}</div>
                    <div class="seat-sub">${t.buyer ? '👤 ' + t.buyer : ''} ${t.price ? '💴 ' + t.price : ''}</div>
                `;
                node.onclick = () => handleSeatClick(t);
                gridEl.appendChild(node);
            }
        });
    }

    async function handleSeatClick(ticket) {
        const action = confirm(`【${ticket.show} - ${ticket.seat}】\n状态: ${ticket.status}\n买家: ${ticket.buyer||'无'}\n价格: ${ticket.price||'无'}\n备注: ${ticket.note||'无'}\n\n点击【确定】切换状态（在手->预定->已出），点击【取消】不作修改。`);
        if (action) {
            const nextStatus = ticket.status === '在手' ? '预定' : (ticket.status === '预定' ? '已出' : '在手');
            await _supabase.from('tickets').update({ status: nextStatus }).eq('id', ticket.id);
            fetchTickets();
        }
    }

    async function addTicket() {
        const show = document.getElementById('in-show').value;
        const type = document.getElementById('in-type').value;
        const seat = document.getElementById('in-seat').value;
        const status = document.getElementById('in-status').value;
        const price = document.getElementById('in-price').value;
        const buyer = document.getElementById('in-buyer').value;
        let note = document.getElementById('in-note').value;

        if(!seat) { alert('请填写临时编号或位置！'); return; }

        note = `[${type}] ${note}`;

        const { error } = await _supabase.from('tickets').insert([{ show, seat, status, price, buyer, note }]);
        if (error) {
            alert('保存失败，请刷新重试');
        } else {
            document.getElementById('in-seat').value = '';
            document.getElementById('in-note').value = '';
            fetchTickets();
        }
    }

    init();
</script>
</body>
</html>
